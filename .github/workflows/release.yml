# Publishes the version every crate names (scripts/version.sh) to crates.io,
# once CI passed on the push to main that set it and it has no tag yet
# (scripts/version.sh unreleased), then tags that commit. The regeneration
# pull request sets the version, so a merged regeneration is released; a
# version set by hand in a pull request is released the same way
# (RELEASING.md).
#
# It publishes with crates.io's trusted publishing: the job's OIDC token,
# exchanged for a short-lived crates.io token, so no token is stored here.
# crates.io refuses a token of a workflow_run, so CI passing on main only
# dispatches this workflow, for the commit it passed on, and the dispatched
# run publishes; a run dispatched by hand releases main's head, or the
# commit `sha` names, once CI passed on it.
# Trusted publishing reaches only crates that exist, so a crate's first
# version is published by hand; until it is, the release publishes the
# others and fails, naming it, without tagging.
# A crate whose version is on crates.io already is skipped, so a release
# that failed half way finishes when it runs again.
#
# Once released, it dispatches origincloudhq/mcp's regeneration with the
# regeneration App's token (REGENERATE_APP_ID and
# REGENERATE_APP_PRIVATE_KEY); without the App, mcp's daily run picks the
# SDK up.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: The commit on main to release; main's head when empty.
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A run dispatched with the workflow token starts, unlike other events it
  # causes.
  dispatch:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref main -f sha="${SHA}"

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: false
    # The environment crates.io's trusted publisher names.
    environment: release
    steps:
      - name: Checkout
        uses: 'actions/checkout@v4'
        with:
          ref: main
          fetch-depth: 0

      # Only a commit on main that CI passed on is released.
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse --verify "${SHA:-HEAD}^{commit}")"
          if ! git merge-base --is-ancestor "${head}" HEAD; then
            echo "::error::${head} isn't on main"
            exit 1
          fi
          passed="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${head}" \
            --event push --status success --json databaseId --jq length)"
          if [[ "${passed}" == 0 ]]; then
            echo "::error::CI hasn't passed on the push of ${head} to main"
            exit 1
          fi
          git checkout --quiet "${head}"
          echo "HEAD=${head}" >> "$GITHUB_ENV"

      - name: Version
        id: version
        run: |
          set -euo pipefail
          version="$(scripts/version.sh current)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if scripts/version.sh unreleased; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "v${version} is released already, or older than the newest tag: nothing to release"
          fi

      # rustup installs the toolchain rust-toolchain.toml names.
      - name: Rust
        if: steps.version.outputs.release == 'true'
        run: rustup toolchain install

      # The published crates, the core crate first: the others depend on it.
      - name: Crates
        id: crates
        if: steps.version.outputs.release == 'true'
        run: |
          set -euo pipefail
          crates="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name' \
            | sort | awk '$0 == "origincloud-core" { print; next } { rest = rest $0 "\n" } END { printf "%s", rest }')"
          missing=()
          for crate in ${crates}; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'origincloudhq/sdk-rust release' \
              "https://crates.io/api/v1/crates/${crate}")"
            if [[ "${status}" == 404 ]]; then
              missing+=("${crate}")
            elif [[ "${status}" != 200 ]]; then
              echo "::error::crates.io answered ${status} for ${crate}"
              exit 1
            fi
          done
          # The crates that exist are published all the same, the core crate
          # among them, so that a new crate's first version, published by
          # hand, finds the core version it depends on.
          echo "crates=$(echo "${crates}" | grep -vxF -f <(printf '%s\n' "${missing[@]}" "") | paste -sd ' ' -)" >> "$GITHUB_OUTPUT"
          echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"

      - name: crates.io token
        id: auth
        if: steps.version.outputs.release == 'true'
        uses: 'rust-lang/crates-io-auth-action@v1'

      - name: Publish
        if: steps.version.outputs.release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.crates.outputs.crates }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for crate in ${CRATES}; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'origincloudhq/sdk-rust release' \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}")"
            if [[ "${status}" == 200 ]]; then
              echo "${crate} ${VERSION} is on crates.io already"
              continue
            fi
            cargo publish --locked -p "${crate}"
          done

      - name: New crates
        if: steps.crates.outputs.missing != ''
        env:
          MISSING: ${{ steps.crates.outputs.missing }}
        run: |
          echo "::error::not on crates.io yet: ${MISSING}. A crate's first version is published by hand (RELEASING.md); then run this again."
          exit 1

      - name: Tag
        if: steps.version.outputs.release == 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "${TAG}" "${HEAD}"
          git push --quiet origin "${TAG}"

      - name: App token
        id: app
        if: steps.version.outputs.release == 'true' && vars.REGENERATE_APP_ID != ''
        uses: 'actions/create-github-app-token@v2'
        with:
          app-id: ${{ vars.REGENERATE_APP_ID }}
          private-key: ${{ secrets.REGENERATE_APP_PRIVATE_KEY }}
          repositories: mcp

      - name: Downstream
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh workflow run regenerate.yml --repo origincloudhq/mcp --ref main
