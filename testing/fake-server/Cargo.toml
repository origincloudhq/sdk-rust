[package]
name = "fake-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "A local HTTP server the SDK's tests answer calls with."

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["net", "rt"] }
