[package]
name = "origincloud-core"
version = "0.53.0"
description = "The client every service crate of the Origin Cloud SDK uses: credentials, endpoints, retries, errors, long-running operations and read-your-writes."
keywords = ["origincloud", "cloud", "sdk", "api"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
fastrand = "2"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "pkcs8"] }
pbjson = "0.9"
pbjson-types = "0.9"
percent-encoding = "2"
prost = "0.14"
reqwest = { version = "0.13", features = ["form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[features]
# `ServiceAccount` on wasm32, for a runtime that isn't a browser (Node.js,
# Deno, an edge worker), from a credentials file's content. Left out by
# default: a browser app, its Web Workers included, is downloaded by
# whoever loads it, so a private key in it is anybody's. Natively
# `ServiceAccount` is always there.
service-account-wasm = []

# Native only: the credential providers' locks and the retry sleep. In a
# browser there is no Tokio timer driver (`tokio::time::sleep` panics on
# `wasm32-unknown-unknown`), so the sleep is a browser timer there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["sync", "time"] }

# In a browser: the retry sleep (`setTimeout`), the clock (`Date.now()`,
# as `SystemTime::now` panics there), and the browser's random numbers for
# request ids and retry jitter (without `js`, fastrand's seed is a
# constant there, so every page would jitter alike). js-sys and getrandom
# are already in the build through reqwest and uuid.
[target.'cfg(target_arch = "wasm32")'.dependencies]
fastrand = { version = "2", features = ["js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fake-server = { path = "../../testing/fake-server" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
