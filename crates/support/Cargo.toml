[package]
name = "origincloud-support"
version = "0.18.0"
description = "The Origin Cloud support API: support cases, each a conversation between an organization and Origin Cloud support about a question or a problem."
keywords = ["origincloud", "cloud", "sdk", "api", "support"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
origincloud-core = { version = "0.18.0", path = "../core" }
pbjson = "0.9"
prost = "0.14"
serde = "1"

[dev-dependencies]
fake-server = { path = "../../testing/fake-server" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
