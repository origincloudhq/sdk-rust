[package]
name = "origincloud-location"
version = "0.10.0"
description = "The Origin Cloud location API: regions and zones, and the services each zone offers."
keywords = ["origincloud", "cloud", "sdk", "regions", "zones"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
origincloud-core = { version = "0.10.0", path = "../core" }
pbjson = "0.9"
prost = "0.14"
serde = "1"

[dev-dependencies]
fake-server = { path = "../../testing/fake-server" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
