[package]
name = "origincloud-iam"
version = "0.24.2"
description = "The Origin Cloud IAM API: users, service accounts, roles, role bindings, permissions and the audit log."
keywords = ["origincloud", "cloud", "sdk", "api", "iam"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
origincloud-core = { version = "0.24.2", path = "../core" }
pbjson = "0.9"
prost = "0.14"
serde = "1"

[dev-dependencies]
fake-server = { path = "../../testing/fake-server" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
