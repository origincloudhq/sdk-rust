[package]
name = "origincloud-network"
version = "0.22.0"
description = "The Origin Cloud network API: VPCs, subnets, routing, gateways, floating IPs, network interfaces, security groups, ACLs and DNS policies."
keywords = ["origincloud", "cloud", "sdk", "api", "network"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
origincloud-core = { version = "0.22.0", path = "../core" }
pbjson = "0.9"
prost = "0.14"
serde = "1"

[dev-dependencies]
fake-server = { path = "../../testing/fake-server" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
