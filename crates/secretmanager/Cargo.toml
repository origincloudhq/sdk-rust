[package]
name = "origincloud-secretmanager"
version = "0.69.0"
description = "The Origin Cloud secretmanager API: secrets: small confidential values, such as a database password, an API key or a TLS private key, kept encrypted and versioned by the platform and read by the people and workloads you allow."
keywords = ["origincloud", "cloud", "sdk", "api", "secretmanager"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
origincloud-core = { version = "0.69.0", path = "../core" }
pbjson = "0.9"
prost = "0.14"
serde = "1"
