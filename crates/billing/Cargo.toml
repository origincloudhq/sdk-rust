[package]
name = "origincloud-billing"
version = "0.24.2"
description = "The Origin Cloud billing API: billing accounts and the projects they pay for, payment methods, cost and usage, spend limits and the price list."
keywords = ["origincloud", "cloud", "sdk", "api", "billing"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
origincloud-core = { version = "0.24.2", path = "../core" }
pbjson = "0.9"
prost = "0.14"
serde = "1"

[dev-dependencies]
fake-server = { path = "../../testing/fake-server" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
