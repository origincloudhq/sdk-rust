[package]
name = "origincloud-resourcemanager"
version = "0.21.0"
description = "The Origin Cloud resourcemanager API: organizations, projects and their quotas."
keywords = ["origincloud", "cloud", "sdk", "api", "resourcemanager"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
origincloud-core = { version = "0.21.0", path = "../core" }
pbjson = "0.9"
prost = "0.14"
serde = "1"

[dev-dependencies]
fake-server = { path = "../../testing/fake-server" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
