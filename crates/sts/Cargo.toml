[package]
name = "origincloud-sts"
version = "0.26.0"
description = "The Origin Cloud STS API: the security token service: it turns a token from an identity provider outside Origin Cloud, such as a CI job's OIDC token, into the access token of a WORKLOAD service account that trusts it through a federated credential."
keywords = ["origincloud", "cloud", "sdk", "api", "sts"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
origincloud-core = { version = "0.26.0", path = "../core" }
pbjson = "0.9"
prost = "0.14"
serde = "1"
